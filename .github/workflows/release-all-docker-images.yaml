name: Release All Sample Docker Images
run-name: ${{ inputs.release_type == 'Snapshot' && 'Publish Pre-release' || format('Release {0}', inputs.release_type)}} Docker Image by @${{ github.actor }}  
on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: 'The type of release'
        options:
        - Major
        - Minor
        - Patch
        - Snapshot

jobs:
  loadImageMatrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Load sample image matrix
        id: matrix
        run: echo "matrix=$(jq -c . .github/sample-images.json)" >> "$GITHUB_OUTPUT"

  incrementVersionNumber:
    uses: iabtechlab/uid2-shared-actions/.github/workflows/shared-increase-version-number.yaml@v3
    with:
      release_type: ${{ inputs.release_type }}
      working_dir: .
      merge_environment: ${{ github.ref_protected && 'ci-auto-merge' || '' }}
    secrets: inherit
    
  publishImages:
    name: Publish ${{ matrix.name }}
    needs:
      - loadImageMatrix
      - incrementVersionNumber
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.loadImageMatrix.outputs.matrix) }}
    uses: iabtechlab/uid2-shared-actions/.github/workflows/shared-publish-to-docker-versioned.yaml@v3
    with:
      new_version: ${{ needs.incrementVersionNumber.outputs.new_version }}
      image_tag: ${{ needs.incrementVersionNumber.outputs.image_tag }}
      release_type: ${{ inputs.release_type }}
      docker_file: ${{ matrix.dockerfile }}
      docker_context: ${{ matrix.context }}
      docker_image_name: ${{ matrix.image }}
      docker_registry: ghcr.io
    secrets: inherit
